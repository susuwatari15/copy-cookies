<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copy Cookies</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <span class="frame-corner tl"></span>
    <span class="frame-corner tr"></span>
    <span class="frame-corner bl"></span>
    <span class="frame-corner br"></span>

    <div class="wrap">
      <header>
        <div class="titlebar">
          <h1>Copy Cookies</h1>
          <button id="settingsBtn" class="icon-btn" title="Cài đặt" aria-label="Cài đặt" aria-expanded="false">
            <span class="gear" aria-hidden="true">⚙</span>
          </button>
        </div>
        <p id="site" class="site">Đang tải…</p>
      </header>

      <div class="divider"><span></span></div>

      <div class="buttons">
        <button id="copyBtn" class="btn btn-primary">
          <span class="icon">⧉</span> Copy cookies
        </button>
        <button id="pasteBtn" class="btn btn-secondary">
          <span class="icon">⤵</span> Paste cookies
        </button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="settings" class="settings" hidden>
        <div class="divider"><span></span></div>
        <h2>Cài đặt</h2>

        <p class="group-label">Khi bấm Copy</p>
        <label class="opt">
          <input type="checkbox" id="opt-includeSubdomains" />
          <span>
            <strong>Lấy thêm cookie của các subdomain</strong>
            <em>Ngoài trang đang mở, lấy cả cookie đặt ở domain cha (.example.com) và ở subdomain khác (api.example.com). Tắt = chỉ lấy cookie của riêng trang đang mở.</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="opt-includePartitioned" />
          <span>
            <strong>Lấy cả cookie Partitioned (CHIPS)</strong>
            <em>Vài cookie được Chrome cất riêng theo từng trang và không hiện ra khi tìm bình thường. Bật để không bỏ sót.</em>
          </span>
        </label>

        <p class="group-label">Khi bấm Paste</p>
        <label class="opt">
          <input type="checkbox" id="opt-remapOnPaste" />
          <span>
            <strong>Gán cookie cho đúng trang đang mở</strong>
            <em>Dán sang trang khác tên miền (vd localhost:5173) thì ghi cookie cho chính trang đó để đăng nhập được ngay. Tắt = giữ tên miền gốc, localhost sẽ không đọc được.</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="opt-familyFilter" />
          <span>
            <strong>Bỏ qua cookie của app không liên quan</strong>
            <em>Chỉ dán cookie của app vừa copy (vd cos-dev kèm cos-api-dev). Cookie trùng tên thì lấy bản gần trang nguồn nhất. Tắt = dán hết, cookie trùng tên có thể ghi đè nhầm nhau.</em>
          </span>
        </label>
        <label class="opt opt-sub" id="row-allowCrossFamily">
          <input type="checkbox" id="opt-allowCrossFamily" />
          <span>
            <strong>Dán kèm cookie của app khác</strong>
            <em>Dán thêm cookie của các app khác cùng công ty (e2e, grove, iso…). Trùng tên thì cookie của app vừa copy vẫn được ưu tiên.</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="opt-forceInsecureOnHttp" />
          <span>
            <strong>Bỏ cờ Secure khi trang chạy http</strong>
            <em>Cookie có cờ Secure không ghi được lên http://localhost. Bật để tự bỏ cờ đó lúc dán. Tắt = giữ nguyên và việc dán có thể thất bại.</em>
          </span>
        </label>

        <button id="resetBtn" class="link-btn">Khôi phục mặc định</button>
      </section>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
